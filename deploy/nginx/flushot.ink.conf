# Flushot — flushot.ink
#
# Static landing page on nginx. No PHP, no database: every request is a file
# from /var/www/flushot.ink, which is a symlink to the current release
# (see /root/deploy-site.sh).
#
# Three server blocks:
#   1. port 80  — redirects everything to https://flushot.ink
#   2. port 443 — the site itself
#   3. port 443 — www.flushot.ink, redirects to the bare domain
#
# The certificate is managed by certbot. Its `ssl_certificate` lines are kept
# exactly as certbot wrote them: renewal finds the block by those paths.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name flushot.ink www.flushot.ink _;

    # One hop, straight to the canonical host: no http -> https -> www -> apex
    # chain. `$request_uri` keeps the path and the query string.
    return 301 https://flushot.ink$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name flushot.ink _;

    root /var/www/flushot.ink;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Serve the real file, then the real directory, then the 404 page.
    # A trailing-slash request for a file must not fall through to the index.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Text assets compress well and this page is almost entirely text.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json;

    # Every asset the page loads is referenced with a hash of its own content
    # (`styles.css?v=4f1c9a02`, written by scripts/stamp-assets.cjs), so a
    # changed file always arrives under a new URL and a year is safe. Without
    # the hash the same headers pinned an old stylesheet in a visitor's browser
    # for a week, which is how two devices ended up showing two different
    # versions of the page. Cache-Control is written once, by hand, instead of
    # `expires` plus an extra header: `expires` would add a second Cache-Control
    # line and the two would have to be read together to know the real policy.
    location ~* \.(woff2|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/flushot-security.conf;
        access_log off;
    }

    # Same reasoning: the references carry a content hash.
    location ~* \.(css|js|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/flushot-security.conf;
    }

    # The document itself is never cached: it is what carries the current hashes,
    # so a stale copy would keep pointing at old assets. `expires -1` writes
    # Cache-Control: no-cache on its own, and this location adds no header of its
    # own — so it keeps the server-level security headers.
    location = /index.html {
        expires -1;
    }

    location = /robots.txt {
        expires 1h;
        log_not_found off;
    }

    location = /sitemap.xml {
        expires 1h;
    }

    include /etc/nginx/flushot-security.conf;

    access_log /var/log/nginx/flushot.access.log;
    error_log /var/log/nginx/flushot.error.log warn;

    ssl_certificate /etc/letsencrypt/live/flushot.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flushot.ink/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flushot.ink;

    # www is an alias, not a second site: one address for the page means one
    # canonical URL, one set of search results and no duplicate content.
    return 301 https://flushot.ink$request_uri;

    ssl_certificate /etc/letsencrypt/live/flushot.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flushot.ink/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
