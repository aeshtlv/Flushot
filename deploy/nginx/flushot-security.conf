# Security headers for flushot.ink.
#
# This file exists because of how nginx inherits `add_header`: a location that
# declares *any* add_header stops inheriting the ones from its server block.
# The cache rules below each need their own Cache-Control, so without this
# include the HSTS and nosniff headers would silently disappear from exactly
# the responses that matter — images, CSS and JS.
#
# Included from the server block and again from every location that sets
# add_header.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
