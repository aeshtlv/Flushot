# nginx configuration for flushot.ink
#
# The stock AlmaLinux file shipped with a `default_server` block serving
# /usr/share/nginx/html. This machine hosts exactly one site, so that block is
# gone and the site config in conf.d/ is the default. Everything else is the
# distribution default.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Site configs. flushot.ink.conf declares itself the default server.
    include /etc/nginx/conf.d/*.conf;
}
