# Rate limiting for the screenshot upload endpoint.
#
# This file is included at `http` level (`/etc/nginx/conf.d/00-flushot-shots-zones.conf`),
# which is why it holds only a zone declaration and no `location`: nginx parses the
# configuration in order, so a zone has to be declared before the server block that
# uses it, and the `00-` prefix is what puts it there.
#
# The zone is keyed on the address, not on anything the client sends, and it is the
# only thing standing between this endpoint and someone filling two gigabytes in a
# minute. Ten a minute sustained, with bursts of ten, is generous for a person taking
# screenshots and useless for a loop.
#
# 1 MB of zone holds about 16 000 addressed clients, far more than this site has.

limit_req_zone $binary_remote_addr zone=flushot_shot:1m rate=10r/m;
