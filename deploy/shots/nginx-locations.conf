# Screenshot uploads and the links they produce.
#
# Included from inside the `flushot.ink` server block in
# /etc/nginx/conf.d/flushot.ink.conf, as one line:
#
#     include /etc/nginx/flushot-shots-locations.conf;
#
# The split exists for the same reason as `/etc/nginx/flushot-security.conf`: that
# file is server infrastructure written by hand, while the page is deployed from
# git, and a deploy must not be able to drop these rules on the floor.
#
# Two paths:
#
#   /api/shot          POSTed to by the program. Proxied to a small Python process
#                      that owns the directory. Never served from disk.
#   /s/<id>.<ext>      The link. Served by nginx straight from the directory, with
#                      no proxy and no script, so a link costs one file read and
#                      keeps working even if the uploader is down.

# ---------------------------------------------------------------- upload endpoint

location ^~ /api/shot {
    # Ten a minute per address, with a short burst. A person taking screenshots
    # never reaches this; a loop does, immediately.
    limit_req zone=flushot_shot burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    # The client sends the finished card, which is at most a couple of megabytes.
    # Three leaves room for a 4K capture and is still small enough that a body
    # over it is a mistake or an attack.
    client_max_body_size 3m;

    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # A 2 MB card took 4.8 s to arrive from a home connection, which is the line and
    # not the server. The timeouts are set for a slow line rather than for the average
    # one: at 30 s a 2 MB upload on a weak mobile connection is cut off, and the user
    # sees a generic failure with no way to tell it apart from a broken server.
    client_body_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    include /etc/nginx/flushot-security.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# ------------------------------------------------------------------ the link itself

location ^~ /s/ {
    alias /var/lib/flushot-shots/;

    # Nothing here is a directory listing. `off` is the default, and it is written
    # out because this location is where a mistake would expose every live link.
    autoindex off;

    # Declared here rather than relying on mime.types: nginx 1.14 predates the
    # `image/webp` entry, and a `.webp` link answered as application/octet-stream
    # would download instead of display in some browsers.
    types {
        image/png  png;
        image/jpeg jpg;
        image/webp webp;
    }

    # The file lives for an hour and its name is unguessable, so there is nothing
    # worth caching: a cached copy would outlive the file it points at.
    add_header Cache-Control "no-store" always;
    # A link is for sharing in a chat, not for indexing. Without this a search
    # engine could surface a stranger's screenshot long after it was deleted.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/flushot-security.conf;

    # An expired link and a link that never existed get the same answer, on purpose:
    # distinguishing them would let anyone test whether an id was ever real.
    error_page 404 =410 /s-expired.html;
}

# `/s/` itself is not a page.
location = /s/ {
    return 410;
}

location = /s-expired.html {
    internal;
    alias /var/www/flushot-shots/expired.html;
    default_type "text/html; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/flushot-security.conf;
}
