name: CI

on:
  push:
    branches: [site]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Site checks
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Contrast in both themes, tokens defined everywhere, local links resolve,
      # every asset carries the current content hash, heading levels, page weight.
      - name: Page checks
        run: npm run verify

      # A page can pass the markup checks and still ship a stale `?v=` stamp, which
      # leaves visitors on the old CSS. `stamp` is idempotent, so it prints either
      # "already up to date" or the list of references it had to move.
      - name: Asset stamps
        run: npm run stamp
