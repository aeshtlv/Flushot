appId: com.flushot.app
productName: Flushot
copyright: Copyright © 2026 Flushot

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # sharp ships its C headers and an install script for people building it from
  # source. The prebuilt binary is what runs here, so the headers are dead weight
  # in an asar that is otherwise all native code.
  - '!node_modules/sharp/src/**'
  - '!node_modules/sharp/install/**'
  - '!node_modules/**/*.d.cts'
  - '!node_modules/**/*.d.mts'

# The interface speaks Russian and English, so the 52 other language packs
# Chromium ships are 48 MB of strings this app never shows. Chromium also uses
# them for its own dialogs — a file picker, a context menu — which is why both
# are here and not just one. The self-test reads a string out of both windows in
# the language the settings ask for.
electronLanguages:
  - ru
  - en-US

# Where a packaged copy looks for a newer release.
#
# The updater reads this at startup and asks GitHub for the newest published
# release. It is written into the installed copy as `app-update.yml`, which is why
# the address lives here and not in the code: the app must not have to guess where
# it came from.
publish:
  provider: github
  owner: aeshtlv
  repo: Flushot
  releaseType: release

# sharp ships prebuilt native binaries that must live outside app.asar
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flushot
  uninstallDisplayName: Flushot
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Splitting the payload is what makes an update a few megabytes instead of ninety:
  # it is stored as blocks of about 20 KB and electron-updater asks only for the
  # blocks whose hash changed.
  #
  # The blocks cannot be compressed as one stream any more, and that costs size.
  # Measured on this exact app: 109,816,371 bytes with the map, 98,940,283 without
  # — 10.4 MB, or 11 %. It is paid once, on the download that installs the program,
  # and every update after it downloads the difference instead of the whole file.
  #
  # The portable target shares this section, but a portable copy can never update
  # itself, so `npm run dist` builds it with the map off from the command line: ten
  # megabytes back for exactly the people who gain nothing by them.
  differentialPackage: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
buildDependenciesFromSource: false
