appId: com.flushot.app
productName: Flushot
copyright: Copyright © 2026 Flushot

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # sharp ships its C headers and an install script for people building it from
  # source. The prebuilt binary is what runs here, so the headers are dead weight
  # in an asar that is otherwise all native code.
  - '!node_modules/sharp/src/**'
  - '!node_modules/sharp/install/**'
  - '!node_modules/**/*.d.cts'
  - '!node_modules/**/*.d.mts'

# The interface is Russian only, so the other 53 language packs Chromium ships
# are 48 MB of strings this app never shows. Chromium falls back to en-US for
# anything the app does not translate, so two packs are enough. The self-test
# confirms it: every string it reads out of both windows comes back in Russian.
electronLanguages:
  - ru
  - en-US

# sharp ships prebuilt native binaries that must live outside app.asar
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flushot
  uninstallDisplayName: Flushot
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # The installer ships a block map for electron-updater's differential
  # downloads. This app has no update server — it is downloaded from GitHub
  # Releases by hand — so the map is never used, and building it splits the
  # payload into 60 independent blocks instead of one solid archive. Measured
  # both ways on the same files: 104.5 MB with the block map, 94.2 MB without.
  # The portable target is NSIS underneath, so this line is worth 10 MB twice.
  differentialPackage: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
buildDependenciesFromSource: false
