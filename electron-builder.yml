appId: com.flushot.app
productName: Flushot
copyright: Copyright © 2026 Flushot

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# sharp ships prebuilt native binaries that must live outside app.asar
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flushot
  uninstallDisplayName: Flushot
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}

npmRebuild: false
buildDependenciesFromSource: false
